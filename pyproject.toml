[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roman2khmer"
version = "0.1.0"
description = "Romanised Khmer (Khmer typed in Latin letters) to Khmer script: a small character model plus a sentence step"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
